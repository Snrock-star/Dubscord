<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dubscord</title>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-dark: #1e1f22;
      --bg-servers: #111214;
      --bg-channels: #2b2d31;
      --bg-chat: #313338;
      --text-main: #dbdee1;
      --text-muted: #949ba4;
      --accent: #5865f2;
      --accent-hover: #4752c4;
      --online: #23a55a;
      --danger: #da373c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'gg sans', sans-serif; }
    body, html { height: 100%; width: 100%; background-color: var(--bg-dark); color: var(--text-main); overflow: hidden; }

    .icon {
      width: 20px; height: 20px; fill: currentColor; display: inline-block;
      vertical-align: middle; flex-shrink: 0;
    }

    /* Modals */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75); display: flex; justify-content: center; align-items: center; z-index: 1000;
      backdrop-filter: blur(2px);
    }
    .modal {
      background: var(--bg-channels); padding: 24px; border-radius: 8px; width: 90%; max-width: 420px; text-align: center;
      box-shadow: 0 8px 16px rgba(0,0,0,0.3); max-height: 90vh; overflow-y: auto;
    }
    .modal h2 { margin-bottom: 12px; color: #fff; }
    .modal h3 { color: #fff; font-size: 15px; margin: 16px 0 8px 0; text-align: left; border-bottom: 1px solid var(--bg-servers); padding-bottom: 4px; }
    .modal p { color: var(--text-muted); font-size: 14px; margin-bottom: 16px; }
    .modal input {
      width: 100%; padding: 10px 12px; border-radius: 4px; border: 1px solid #111; background: var(--bg-dark);
      color: var(--text-main); font-size: 14px; margin-bottom: 10px; outline: none;
    }

    .password-wrapper { position: relative; width: 100%; margin-bottom: 10px; }
    .password-wrapper input { margin-bottom: 0; padding-right: 42px; }
    .toggle-password-btn {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--text-muted); cursor: pointer;
      padding: 4px; display: flex; align-items: center; justify-content: center;
    }
    .toggle-password-btn:hover { color: #fff; }

    .modal button.action-btn {
      width: 100%; padding: 10px; border: none; border-radius: 4px; background: var(--accent);
      color: #fff; font-size: 15px; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 4px;
    }
    .modal button.action-btn:hover { background: var(--accent-hover); }
    .tab-btn-group { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab-btn { flex: 1; padding: 8px; background: var(--bg-dark); color: var(--text-muted); border: none; border-radius: 4px; cursor: pointer; }
    .tab-btn.active { background: var(--accent); color: #fff; font-weight: bold; }

    .forgot-link { display: inline-block; color: var(--accent); font-size: 13px; text-decoration: none; margin-top: 6px; cursor: pointer; }
    .forgot-link:hover { text-decoration: underline; }

    .setting-item { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; text-align: left; }

    /* Incoming Call Overlay */
    .incoming-call-box {
      position: fixed; top: 20px; right: 20px; background: var(--bg-channels); border: 2px solid var(--accent);
      padding: 16px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); z-index: 2000;
      display: flex; flex-direction: column; align-items: center; gap: 12px; animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
    .incoming-btn-group { display: flex; gap: 12px; }
    .btn-accept { background: var(--online) !important; width: auto !important; padding: 8px 16px !important; color:#fff; border:none; border-radius:4px; cursor:pointer; font-weight:bold; }
    .btn-decline { background: var(--danger) !important; width: auto !important; padding: 8px 16px !important; color:#fff; border:none; border-radius:4px; cursor:pointer; font-weight:bold; }

    /* Banner under Header */
    .active-call-banner {
      background: #23a55a; color: #fff; padding: 8px 16px; display: flex;
      align-items: center; justify-content: space-between; font-size: 14px; font-weight: 500;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 5;
    }
    .active-call-banner .banner-info { display: flex; align-items: center; gap: 8px; }
    .active-call-banner button {
      background: rgba(255, 255, 255, 0.2); border: none; color: #fff; padding: 4px 12px;
      border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s;
    }
    .active-call-banner button:hover { background: rgba(255, 255, 255, 0.35); }

    /* Call Box (Floating / Modal) */
    .call-modal {
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      height: 380px; width: 100%; max-width: 350px; background: var(--bg-servers); border-radius: 12px; padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .call-modal.minimized {
      position: fixed; bottom: 80px; right: 20px; width: 220px; height: 180px;
      z-index: 999; padding: 8px; border: 1px solid var(--accent);
    }
    .call-modal.minimized h3 { font-size: 12px; margin-bottom: 4px; }
    .call-modal.minimized .call-controls { margin-top: 4px; gap: 6px; }
    .call-modal.minimized .call-ctrl-btn { width: 32px; height: 32px; }

    .call-video-container {
      width: 100%; flex: 1; background: #000; border-radius: 8px; overflow: hidden; position: relative;
      display: flex; justify-content: center; align-items: center;
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    .local-video-preview {
      position: absolute; bottom: 8px; right: 8px; width: 80px; height: 60px;
      border-radius: 4px; border: 1px solid #fff; overflow: hidden; z-index: 2;
    }

    .call-controls { display: flex; gap: 12px; margin-top: 12px; width: 100%; justify-content: center; }
    .call-ctrl-btn {
      width: 44px; height: 44px; border-radius: 50%; border: none; background: #383a40; color: #fff;
      cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s;
    }
    .call-ctrl-btn:hover { background: #4e5058; }
    .call-ctrl-btn.active, .call-ctrl-btn.end-call { background: var(--danger); }

    /* Mobile Backdrop */
    .mobile-backdrop {
      display: none; position: fixed; top: 0; left: 72px; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.4); z-index: 8; transition: opacity 0.2s;
    }
    .mobile-backdrop.active { display: block; }

    /* Layout */
    #app { display: flex; height: 100vh; width: 100vw; position: relative; overflow: hidden; }

    .servers-sidebar {
      width: 72px; background: var(--bg-servers); display: flex; flex-direction: column; align-items: center;
      padding: 12px 0; gap: 8px; z-index: 10; flex-shrink: 0; overflow-y: auto;
    }
    .server-icon {
      width: 48px; height: 48px; border-radius: 50%; background: var(--bg-channels); color: var(--text-main);
      display: flex; justify-content: center; align-items: center; font-weight: bold; cursor: pointer;
      transition: all 0.2s; font-size: 18px; text-align: center; flex-shrink: 0;
    }
    .server-icon:hover, .server-icon.active { border-radius: 16px; background: var(--accent); color: #fff; }
    .server-icon.add-btn { background: #23a55a; color: #fff; }
    .divider { width: 32px; height: 2px; background: var(--bg-channels); margin: 4px 0; flex-shrink: 0; }

    .channels-sidebar { width: 240px; background: var(--bg-channels); display: flex; flex-direction: column; flex-shrink: 0; z-index: 9; }
    .server-header {
      height: 48px; border-bottom: 1px solid var(--bg-servers); display: flex; align-items: center;
      justify-content: space-between; padding: 0 16px; font-weight: bold; color: #fff;
    }
    .server-id-badge { font-size: 11px; color: var(--text-muted); font-weight: normal; }
    .delete-srv-btn { color: var(--danger); cursor: pointer; display: none; padding: 4px; }

    .user-panel { height: 52px; background: #232428; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; margin-top: auto; }
    .user-info { display: flex; align-items: center; gap: 8px; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: bold; color: #fff; flex-shrink: 0; }
    .username { font-size: 14px; font-weight: bold; color: #fff; }
    .status { font-size: 11px; color: var(--online); }
    .icon-btn { cursor: pointer; color: var(--text-muted); padding: 6px; display: flex; align-items: center; justify-content: center; border-radius: 4px; }
    .icon-btn:hover { color: #fff; background: rgba(255,255,255,0.05); }

    .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-chat); min-width: 0; }
    .chat-header {
      height: 48px; border-bottom: 1px solid var(--bg-servers); display: flex; align-items: center;
      padding: 0 16px; font-weight: bold; color: #fff; justify-content: space-between;
    }
    .chat-actions { display: flex; gap: 8px; align-items: center; }

    .chat-messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .message { display: flex; gap: 12px; }
    .message-author { font-weight: bold; font-size: 14px; color: #fff; }
    .message-author span { font-size: 10px; color: var(--text-muted); margin-left: 6px; font-weight: normal; }
    .message-text { color: var(--text-main); font-size: 15px; word-break: break-word; }
    .system-message { color: var(--text-muted); font-style: italic; font-size: 13px; display: flex; align-items: center; gap: 6px; }

    .file-attachment {
      display: inline-flex; align-items: center; gap: 8px; background: #2b2d31; padding: 8px 12px;
      border-radius: 4px; margin-top: 6px; text-decoration: none; color: var(--accent); font-size: 14px; border: 1px solid #111;
    }

    .chat-input-container { padding: 0 16px 16px 16px; }
    .chat-input-wrapper { background: #383a40; border-radius: 8px; display: flex; align-items: center; padding: 0 12px; gap: 8px; }
    .file-btn { cursor: pointer; color: var(--text-muted); padding: 4px; display: flex; align-items: center; }
    .file-btn:hover { color: #fff; }
    .chat-input { width: 100%; padding: 12px 0; background: transparent; border: none; color: var(--text-main); font-size: 15px; outline: none; }

    .members-sidebar { width: 200px; background: var(--bg-channels); padding: 16px 8px; display: flex; flex-direction: column; gap: 8px; z-index: 9; flex-shrink: 0; }
    .member-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 4px; }
    .member-name { font-size: 14px; color: var(--text-main); }

    .mobile-menu-btn { display: none; background: none; border: none; color: #fff; cursor: pointer; padding: 4px; }

    @media (max-width: 768px) {
      .mobile-menu-btn { display: flex; }
      .channels-sidebar { position: absolute; left: 72px; top: 0; bottom: 0; width: 220px; transform: translateX(-150%); transition: transform 0.25s ease-in-out; }
      .channels-sidebar.open { transform: translateX(0); }
      .members-sidebar { position: absolute; right: 0; top: 0; bottom: 0; width: 220px; transform: translateX(100%); transition: transform 0.25s ease-in-out; }
      .members-sidebar.open { transform: translateX(0); }
    }
  </style>
</head>
<body>

  <div id="mobileBackdrop" class="mobile-backdrop" onclick="closeMobileDrawers()"></div>

  <!-- Modal Auth -->
  <div id="authModal" class="modal-overlay">
    <div class="modal">
      <h2>Dubscord</h2>
      <div class="tab-btn-group">
        <button id="tabLogin" class="tab-btn active" onclick="switchAuthTab('login')">Вход</button>
        <button id="tabRegister" class="tab-btn" onclick="switchAuthTab('register')">Регистрация</button>
      </div>
      
      <div id="regUsernameBox" style="display: none;">
        <input type="text" id="authUsername" placeholder="Ваш никнейм..." maxlength="20" autocomplete="off">
      </div>
      
      <input type="email" id="authEmail" placeholder="Ваш Email..." autocomplete="off">
      
      <div class="password-wrapper">
        <input type="password" id="authPassword" placeholder="Пароль..." autocomplete="off">
        <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('authPassword', this)" title="Показать/скрыть">
          <svg class="icon"><use href="#icon-eye"/></svg>
        </button>
      </div>

      <button id="authSubmitBtn" class="action-btn" onclick="handleAuth()">Войти</button>
      <div>
        <a class="forgot-link" id="forgotPwdBtn" onclick="resetPassword()">Забыли пароль?</a>
      </div>
    </div>
  </div>

  <!-- Modal Settings -->
  <div id="settingsModal" class="modal-overlay" style="display: none;">
    <div class="modal">
      <h2>Настройки профиля</h2>
      
      <h3>Основные настройки</h3>
      <div class="setting-item">
        <label for="setAllowCalls">Входящие звонки</label>
        <input type="checkbox" id="setAllowCalls" checked onchange="saveSettings()" style="width:auto; margin:0;">
      </div>
      <div class="setting-item">
        <label for="setAllowNotifications">Уведомления</label>
        <input type="checkbox" id="setAllowNotifications" checked onchange="saveSettings()" style="width:auto; margin:0;">
      </div>

      <h3>Изменить Никнейм</h3>
      <input type="text" id="editUsername" placeholder="Новый никнейм">
      <button class="action-btn" onclick="updateUsername()">Сохранить никнейм</button>

      <h3>Изменить Email</h3>
      <input type="email" id="editEmail" placeholder="Новый Email">
      <div class="password-wrapper">

        <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('currentPwdForPwd', this)">
          <svg class="icon"><use href="#icon-eye"/></svg>
        </button>
      </div>
      <div class="password-wrapper">
        <input type="password" id="newPassword" placeholder="Новый пароль">
        <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('newPassword', this)">

      <button class="action-btn" onclick="closeSettingsModal()" style="background: transparent; color: var(--text-muted); margin-top: 12px;">Закрыть</button>

  <!-- Modal Server -->
  <div id="serverModal" class="modal-overlay" style="display: none;">
    <div class="modal">
      <h2>Сервера</h2>

  <!-- Call Modal Wrapper -->
  <div id="callOverlayContainer" class="modal-overlay" style="display: none;">
    <div id="callModal" class="call-modal">
      <div style="display: flex; justify-content: space-between; width: 100%; align-items: center; margin-bottom: 8px;">

      <div class="call-video-container">

  <div id="app">
    <div class="servers-sidebar">
      <div class="server-icon active" id="server-btn-main" onclick="switchServer('main')" title="Главный Сервер">

      <div class="server-icon add-btn" onclick="openServerModal()" title="Создать или войти на сервер">
        <svg class="icon" style="width:24px; height:24px;"><use href="#icon-plus"/></svg>

    <div class="channels-sidebar" id="channelsSidebar">
      <div class="server-header">
        <div>
          <div id="currentServerName">Основной #1</div>
          <div class="server-id-badge" id="currentServerId">ID: main</div>
        </div>
        <div class="delete-srv-btn icon-btn" id="deleteServerBtn" onclick="deleteCurrentServer()" title="Удалить сервер">
          <svg class="icon" style="color:var(--danger)"><use href="#icon-trash"/></svg>

      <div class="user-panel">
        <div class="user-info">

            <span class="username" id="displayUsername">Гость</span>
            <span class="status">● В сети</span>

        <div style="display:flex; gap:2px;">
          <div class="icon-btn" onclick="openSettingsModal()" title="Настройки">
            <svg class="icon"><use href="#icon-settings"/></svg>

          <div class="icon-btn" onclick="logout()" title="Выйти">

    <div class="chat-area">
      <div class="chat-header">
        <div style="display: flex; align-items: center; gap: 8px;">
          <button class="mobile-menu-btn" onclick="toggleMobileSidebar()">
            <svg class="icon"><use href="#icon-menu"/></svg>
          </button>
          <span># общий-чат</span>
        </div>
        <div class="chat-actions">
          <button class="icon-btn" onclick="startCall('audio')" title="Голосовой звонок">
            <svg class="icon"><use href="#icon-phone"/></svg>
          </button>
          <button class="icon-btn" onclick="startCall('video')" title="Видеозвонок">
            <svg class="icon"><use href="#icon-video"/></svg>
          </button>
          <button class="mobile-menu-btn" onclick="toggleMobileMembers()">
            <svg class="icon"><use href="#icon-users"/></svg>
          </button>

      <div id="activeCallBanner" class="active-call-banner" style="display: none;">
        <div class="banner-info">

          <span>Идёт звонок... <b id="callTimer">00:00</b></span>

        <div class="chat-input-wrapper">
          <label for="fileInput" class="file-btn" title="Прикрепить файл">
            <svg class="icon"><use href="#icon-attach"/></svg>

          <input type="text" id="messageInput" class="chat-input" placeholder="Написать сообщение..." onkeydown="handleKeyPress(event)">
        </div>

    <div class="members-sidebar" id="membersSidebar">
      <div style="font-size:12px; font-weight:bold; color:var(--text-muted); margin-bottom:8px;">В СЕТИ — <span id="onlineCount">0</span></div>
      <div id="membersList"></div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyC5HEE8ILYYXAW_iqZZu8m5CY4wrEv92CY",
      authDomain: "dubscord-cdc6e.firebaseapp.com",
      databaseURL: "https://dubscord-cdc6e-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "dubscord-cdc6e",
      storageBucket: "dubscord-cdc6e.firebasestorage.app",
      messagingSenderId: "509831285529",
      appId: "1:509831285529:web:45027c10fa88fe614dd388",
      measurementId: "G-S5HS7Y07EH"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let currentUser = null;
    let currentServerId = 'main';
    let userServers = JSON.parse(localStorage.getItem('dubscord_servers') || '["main"]');
    let currentAuthMode = 'login';

    let allowCalls = localStorage.getItem('dubscord_allow_calls') !== 'false';
    let allowNotifications = localStorage.getItem('dubscord_allow_notifs') !== 'false';

    /* WebRTC & Calls State */
    let peerConnection = null;
    let localStream = null;
    let remoteStream = null;
    let currentCallSessionRef = null;
    let activeIncomingCall = null;
    let currentCallType = null;
    let callStartTime = null;
    let callTimerInterval = null;
    let isMicMuted = false;
    let isCallMinimized = false;

    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19020' },
        { urls: 'stun:stun1.l.google.com:19020' }
      ]
    };

    function togglePasswordVisibility(inputId, btn) {
      const pwdInput = document.getElementById(inputId);
      const useEl = btn.querySelector('use');
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        useEl.setAttribute('href', '#icon-eye-off');
      } else {
        pwdInput.type = 'password';
        useEl.setAttribute('href', '#icon-eye');
      }
    }

    auth.onAuthStateChanged((user) => {
      if (user) {
        currentUser = user;
        document.getElementById('authModal').style.display = 'none';
        initUser();
      } else {
        currentUser = null;
        document.getElementById('authModal').style.display = 'flex';
      }
    });

    function switchAuthTab(mode) {
      currentAuthMode = mode;
      document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
      document.getElementById('tabRegister').classList.toggle('active', mode === 'register');
      document.getElementById('regUsernameBox').style.display = mode === 'register' ? 'block' : 'none';
      document.getElementById('forgotPwdBtn').style.display = mode === 'login' ? 'inline-block' : 'none';
      document.getElementById('authSubmitBtn').innerText = mode === 'login' ? 'Войти' : 'Зарегистрироваться';
    }

    function handleAuth() {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value.trim();

      if (!email || !password) return alert('Заполните Email и пароль!');

      if (currentAuthMode === 'register') {
        const username = document.getElementById('authUsername').value.trim();
        if (!username) return alert('Введите никнейм!');

        auth.createUserWithEmailAndPassword(email, password)
          .then((cred) => {
            return cred.user.updateProfile({ displayName: username }).then(() => {
              return db.ref('users/' + cred.user.uid).set({ username: username, email: email });
            });
          })
          .catch(err => alert('Ошибка регистрации: ' + err.message));
      } else {
        auth.signInWithEmailAndPassword(email, password)
          .catch(err => alert('Неверный Email или пароль!'));
      }
    }

    function resetPassword() {
      const email = document.getElementById('authEmail').value.trim();
      if (!email) return alert('Введите ваш Email в поле выше!');
      auth.sendPasswordResetEmail(email)
        .then(() => alert('Письмо для сброса пароля отправлено на ' + email))
        .catch(err => alert('Ошибка: ' + err.message));
    }

    function logout() {
      if (confirm('Выйти из аккаунта?')) {
        if (currentUser) {
          db.ref(`servers/${currentServerId}/online/${currentUser.uid}`).remove();
        }
        auth.signOut();
      }
    }

    function openSettingsModal() {
      document.getElementById('setAllowCalls').checked = allowCalls;
      document.getElementById('setAllowNotifications').checked = allowNotifications;
      document.getElementById('editUsername').value = getUserName();
      document.getElementById('editEmail').value = currentUser ? currentUser.email : '';
      document.getElementById('settingsModal').style.display = 'flex';
    }

    function closeSettingsModal() { document.getElementById('settingsModal').style.display = 'none'; }

    function saveSettings() {
      allowCalls = document.getElementById('setAllowCalls').checked;
      allowNotifications = document.getElementById('setAllowNotifications').checked;
      localStorage.setItem('dubscord_allow_calls', allowCalls);
      localStorage.setItem('dubscord_allow_notifs', allowNotifications);
    }

    function updateUsername() {
      const newName = document.getElementById('editUsername').value.trim();
      if (!newName) return alert('Введите никнейм!');
      
      currentUser.updateProfile({ displayName: newName })
        .then(() => {
          db.ref(`users/${currentUser.uid}/username`).set(newName);
          initUser();
          alert('Никнейм успешно изменен!');
        })
        .catch(err => alert('Ошибка: ' + err.message));
    }

    function updateEmail() {
      const newEmail = document.getElementById('editEmail').value.trim();
      const password = document.getElementById('confirmPwdForEmail').value.trim();

      if (!newEmail || !password) return alert('Заполните новый Email и текущий пароль!');

      const credential = firebase.auth.EmailAuthProvider.credential(currentUser.email, password);

      currentUser.reauthenticateWithCredential(credential)
        .then(() => currentUser.updateEmail(newEmail))
        .then(() => {
          db.ref(`users/${currentUser.uid}/email`).set(newEmail);
          alert('Email успешно изменен!');
          document.getElementById('confirmPwdForEmail').value = '';
        })
        .catch(err => alert('Ошибка при смене Email: ' + err.message));
    }

    function updatePassword() {
      const oldPassword = document.getElementById('currentPwdForPwd').value.trim();
      const newPassword = document.getElementById('newPassword').value.trim();

      if (!oldPassword || !newPassword) return alert('Заполните старый и новый пароль!');
      if (newPassword.length < 6) return alert('Новый пароль должен быть от 6 символов!');

      const credential = firebase.auth.EmailAuthProvider.credential(currentUser.email, oldPassword);

      currentUser.reauthenticateWithCredential(credential)
        .then(() => currentUser.updatePassword(newPassword))
        .then(() => {
          alert('Пароль успешно обновлен!');
          document.getElementById('currentPwdForPwd').value = '';
          document.getElementById('newPassword').value = '';
        })
        .catch(err => alert('Ошибка при смене пароля: ' + err.message));
    }

    function getUserName() {
      return (currentUser && currentUser.displayName) ? currentUser.displayName : 'Пользователь';
    }

    function initUser() {
      const name = getUserName();
      document.getElementById('displayUsername').innerText = name;
      document.getElementById('userAvatar').innerText = name.charAt(0).toUpperCase();
      renderServerList();
      switchServer(currentServerId);
      listenGlobalCalls();
    }

    function setupPresence() {
      if (!currentUser) return;
      const userRef = db.ref(`servers/${currentServerId}/online/${currentUser.uid}`);
      userRef.set({ name: getUserName() });
      userRef.onDisconnect().remove();

      db.ref(`servers/${currentServerId}/online`).on('value', (snapshot) => {
        const membersList = document.getElementById('membersList');
        membersList.innerHTML = '';
        const users = snapshot.val() || {};
        document.getElementById('onlineCount').innerText = Object.keys(users).length;

        Object.values(users).forEach(u => {
          const item = document.createElement('div');
          item.className = 'member-item';
          item.innerHTML = `
            <div class="avatar" style="width:24px; height:24px; font-size:12px;">${(u.name || '?').charAt(0).toUpperCase()}</div>
            <span class="member-name">${escapeHtml(u.name)}</span>
          `;
          membersList.appendChild(item);
        });
      });
    }

    function openServerModal() { document.getElementById('serverModal').style.display = 'flex'; }
    function closeServerModal() { document.getElementById('serverModal').style.display = 'none'; }

    function createNewServer() {
      const name = document.getElementById('serverInput').value.trim();
      const iconEmoji = document.getElementById('serverIconInput').value.trim() || '💬';
      if (!name) return alert('Введите название!');
      const newId = 'srv_' + Math.random().toString(36).substr(2, 6);

      db.ref(`servers/${newId}/meta`).set({ name: name, icon: iconEmoji, createdBy: getUserName() });
      if (!userServers.includes(newId)) {
        userServers.push(newId);
        localStorage.setItem('dubscord_servers', JSON.stringify(userServers));
      }
      document.getElementById('serverInput').value = '';
      document.getElementById('serverIconInput').value = '';
      closeServerModal();
      renderServerList();
      switchServer(newId);
    }

    function joinServerById() {
      const id = document.getElementById('serverInput').value.trim();
      if (!id) return alert('Введите ID сервера!');
      if (!userServers.includes(id)) {
        userServers.push(id);
        localStorage.setItem('dubscord_servers', JSON.stringify(userServers));
      }
      document.getElementById('serverInput').value = '';
      closeServerModal();
      renderServerList();
      switchServer(id);
    }

    function deleteCurrentServer() {
      if (currentServerId === 'main') return alert('Основной сервер нельзя удалить!');
      if (confirm('Удалить этот сервер?')) {
        db.ref(`servers/${currentServerId}`).remove();
        userServers = userServers.filter(id => id !== currentServerId);
        localStorage.setItem('dubscord_servers', JSON.stringify(userServers));
        switchServer('main');
      }
    }

    function renderServerList() {
      const container = document.getElementById('custom-servers-list');
      container.innerHTML = '';

      userServers.forEach(srvId => {
        if (srvId === 'main') return;
        const icon = document.createElement('div');
        icon.className = `server-icon ${currentServerId === srvId ? 'active' : ''}`;
        
        db.ref(`servers/${srvId}/meta`).once('value', (s) => {
          const meta = s.val() || {};
          icon.innerText = meta.icon || srvId.substr(4, 2).toUpperCase();
          if (meta.name) icon.title = `${meta.name} (ID: ${srvId})`;
        });

        icon.onclick = () => switchServer(srvId);
        container.appendChild(icon);
      });
    }

    function switchServer(serverId) {
      closeMobileDrawers();
      if (currentUser) {
        db.ref(`servers/${currentServerId}/online/${currentUser.uid}`).remove();
      }
      db.ref(`servers/${currentServerId}/messages`).off();
      db.ref(`servers/${currentServerId}/online`).off();

      currentServerId = serverId;
      document.getElementById('currentServerId').innerText = `ID: ${serverId}`;
      const deleteBtn = document.getElementById('deleteServerBtn');

      if (serverId === 'main') {
        document.getElementById('currentServerName').innerText = 'Главный Сервер';
        document.getElementById('server-btn-main').classList.add('active');
        deleteBtn.style.display = 'none';
      } else {
        document.getElementById('server-btn-main').classList.remove('active');
        deleteBtn.style.display = 'flex';
        db.ref(`servers/${serverId}/meta`).once('value', (s) => {
          const meta = s.val() || {};
          document.getElementById('currentServerName').innerText = `${meta.icon || ''} ${meta.name || 'Сервер'}`;
        });
      }

      renderServerList();
      setupPresence();
      listenMessages();
    }

    function listenMessages() {
      const chatMessages = document.getElementById('chatMessages');
      chatMessages.innerHTML = '';

      db.ref(`servers/${currentServerId}/messages`).limitToLast(50).on('child_added', (snapshot) => {
        const msg = snapshot.val();
        const msgEl = document.createElement('div');
        
        if (msg.isSystem) {
          msgEl.className = 'system-message';
          msgEl.innerHTML = `
            <svg class="icon" style="width:16px; height:16px;"><use href="#icon-phone-off"/></svg>
            <span><b>${escapeHtml(msg.author)}</b> ${escapeHtml(msg.text)}</span>
            <span style="font-size:10px;">${msg.time || ''}</span>
          `;
        } else {
          msgEl.className = 'message';
          let contentHtml = `<div class="message-text">${escapeHtml(msg.text || '')}</div>`;
          if (msg.file) {
            contentHtml += `
              <a href="${msg.file.data}" download="${escapeHtml(msg.file.name)}" class="file-attachment">
                <svg class="icon"><use href="#icon-attach"/></svg> ${escapeHtml(msg.file.name)} <span>(Скачать)</span>
              </a>
            `;
          }

          msgEl.innerHTML = `
            <div class="avatar">${(msg.author || '?').charAt(0).toUpperCase()}</div>
            <div>
              <div class="message-author">${escapeHtml(msg.author)} <span>${msg.time || ''}</span></div>
              ${contentHtml}
            </div>
          `;
        }

        chatMessages.appendChild(msgEl);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        if (msg.author !== getUserName() && allowNotifications && !msg.isSystem) {
          playBeepSound();
        }
      });
    }

    function sendMessage(text, fileData = null, isSystem = false) {
      const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const msgObj = { author: getUserName(), text: text, time: timeStr, isSystem: isSystem };
      if (fileData) msgObj.file = fileData;
      db.ref(`servers/${currentServerId}/messages`).push(msgObj);
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') {
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (!text) return;
        sendMessage(text);
        input.value = '';
      }
    }

    function handleFileUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 5 * 1024 * 1024) return alert('Размер файла больше 5 МБ');

      const reader = new FileReader();
      reader.onload = function(evt) {
        sendMessage(`Отправлен файл: ${file.name}`, { name: file.name, data: evt.target.result });
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    }

    /* WebRTC signaling & Global Call Handlers */
    function listenGlobalCalls() {
      db.ref(`global_calls`).on('child_added', (snapshot) => {
        const call = snapshot.val();
        if (call.caller !== getUserName() && allowCalls) {
          activeIncomingCall = { ...call, key: snapshot.key };
          document.getElementById('incomingCallText').innerText = `Звонок от ${call.caller}...`;
          document.getElementById('incomingCallBox').style.display = 'flex';
          document.getElementById('activeCallBanner').style.display = 'flex';
        }
      });

      db.ref(`global_calls`).on('child_removed', (snapshot) => {
        if (activeIncomingCall && activeIncomingCall.key === snapshot.key) {
          declineIncomingCall();
        }
      });
    }

    async function setupPeerConnection(callRef) {
      peerConnection = new RTCPeerConnection(rtcConfig);
      remoteStream = new MediaStream();
      document.getElementById('remoteVideo').srcObject = remoteStream;

      localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

      peerConnection.ontrack = (event) => {
        event.streams[0].getTracks().forEach(track => remoteStream.addTrack(track));
      };

      const callerCandidatesRef = callRef.child('callerCandidates');
      const calleeCandidatesRef = callRef.child('calleeCandidates');

      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          if (currentCallSessionRef) {
            const candidateRef = (currentCallSessionRef.isCaller) ? callerCandidatesRef : calleeCandidatesRef;
            candidateRef.push(event.candidate.toJSON());
          }
        }
      };
    }

    async function startCall(type) {
      currentCallType = type;
      showCallUI(type);

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: type === 'video' });
        
        if (type === 'video') {
          document.getElementById('localVideo').srcObject = localStream;
          document.getElementById('localVideoContainer').style.display = 'block';
        } else {
          document.getElementById('localVideoContainer').style.display = 'none';
        }

        const callRef = db.ref('global_calls').push();
        currentCallSessionRef = callRef;
        currentCallSessionRef.isCaller = true;

        await setupPeerConnection(callRef);

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);

        await callRef.set({
          caller: getUserName(),
          serverId: currentServerId,
          type: type,
          offer: { type: offer.type, sdp: offer.sdp }
        });

        callRef.child('answer').on('value', async (snapshot) => {
          const answer = snapshot.val();
          if (answer && !peerConnection.currentRemoteDescription) {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
          }
        });

        callRef.child('calleeCandidates').on('child_added', (snapshot) => {
          const candidate = new RTCIceCandidate(snapshot.val());
          peerConnection.addIceCandidate(candidate);
        });

        startCallTimer();
        sendMessage(`Начал(а) ${type === 'video' ? 'видеозвонок' : 'голосовой звонок'}`, null, true);

      } catch (err) {
        alert('Ошибка доступа к устройствам ввода: ' + err.message);
        endCall(false);
      }
    }

    async function acceptIncomingCall() {
      document.getElementById('incomingCallBox').style.display = 'none';
      if (!activeIncomingCall) return;

      if (activeIncomingCall.serverId !== currentServerId) {
        switchServer(activeIncomingCall.serverId);
      }

      const type = activeIncomingCall.type;
      currentCallType = type;
      showCallUI(type);

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: type === 'video' });

        if (type === 'video') {
          document.getElementById('localVideo').srcObject = localStream;
          document.getElementById('localVideoContainer').style.display = 'block';
        } else {
          document.getElementById('localVideoContainer').style.display = 'none';
        }

        const callRef = db.ref(`global_calls/${activeIncomingCall.key}`);
        currentCallSessionRef = callRef;
        currentCallSessionRef.isCaller = false;

        await setupPeerConnection(callRef);

        callRef.child('offer').once('value', async (snapshot) => {
          const offer = snapshot.val();
          if (offer) {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);

            await callRef.child('answer').set({ type: answer.type, sdp: answer.sdp });
          }
        });

        callRef.child('callerCandidates').on('child_added', (snapshot) => {
          const candidate = new RTCIceCandidate(snapshot.val());
          peerConnection.addIceCandidate(candidate);
        });

        startCallTimer();

      } catch (err) {
        alert('Не удалось подключиться к вызову: ' + err.message);
        endCall(false);
      }
    }

    function showCallUI(type) {
      const container = document.getElementById('callOverlayContainer');
      const modal = document.getElementById('callModal');
      container.style.display = 'flex';
      modal.classList.remove('minimized');
      isCallMinimized = false;
      document.getElementById('callTitle').innerText = type === 'video' ? 'Видеозвонок...' : 'Голосовой звонок...';
    }

    function toggleCallMinimize() {
      const container = document.getElementById('callOverlayContainer');
      const modal = document.getElementById('callModal');
      
      isCallMinimized = !isCallMinimized;
      if (isCallMinimized) {
        container.style.display = 'block';
        container.classList.remove('modal-overlay');
        modal.classList.add('minimized');
      } else {
        container.style.display = 'flex';
        container.classList.add('modal-overlay');
        modal.classList.remove('minimized');
      }
    }

    function startCallTimer() {
      callStartTime = Date.now();
      document.getElementById('activeCallBanner').style.display = 'flex';
      if (callTimerInterval) clearInterval(callTimerInterval);

      callTimerInterval = setInterval(() => {
        const diff = Math.floor((Date.now() - callStartTime) / 1000);
        const m = String(Math.floor(diff / 60)).padStart(2, '0');
        const s = String(diff % 60).padStart(2, '0');
        document.getElementById('callTimer').innerText = `${m}:${s}`;
      }, 1000);
    }

    function reopenCallModal() {
      showCallUI(currentCallType || 'audio');
    }

    function declineIncomingCall() {
      document.getElementById('incomingCallBox').style.display = 'none';
      if (!peerConnection) {
        document.getElementById('activeCallBanner').style.display = 'none';
      }
      activeIncomingCall = null;
    }

    function toggleMuteMic() {
      if (!localStream) return;
      isMicMuted = !isMicMuted;
      localStream.getAudioTracks().forEach(track => { track.enabled = !isMicMuted; });
      const micBtn = document.getElementById('micBtn');
      micBtn.querySelector('use').setAttribute('href', isMicMuted ? '#icon-mic-off' : '#icon-mic');
      micBtn.classList.toggle('active', isMicMuted);
    }

    async function toggleAudioOutput() {
      // Использование встроенного спикерфона браузера по умолчанию
    }

    function endCall(sendNotify = true) {
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }

      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }

      if (currentCallSessionRef) {
        currentCallSessionRef.remove();
        currentCallSessionRef = null;
      }

      if (callTimerInterval) {
        clearInterval(callTimerInterval);
        callTimerInterval = null;
      }

      const container = document.getElementById('callOverlayContainer');
      container.style.display = 'none';
      container.classList.add('modal-overlay');
      document.getElementById('activeCallBanner').style.display = 'none';

      if (sendNotify && currentCallType) {
        sendMessage(`Завершил(а) ${currentCallType === 'video' ? 'видеозвонок' : 'звонок'}`, null, true);
        currentCallType = null;
      }
    }

    function playBeepSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.connect(ctx.destination);
        osc.frequency.value = 800;
        osc.start();
        osc.stop(ctx.currentTime + 0.15);
      } catch(e) {}
    }

    function toggleMobileSidebar() {
      const sidebar = document.getElementById('channelsSidebar');
      const backdrop = document.getElementById('mobileBackdrop');
      document.getElementById('membersSidebar').classList.remove('open');
      sidebar.classList.toggle('open');
      backdrop.classList.toggle('active', sidebar.classList.contains('open'));
    }

    function toggleMobileMembers() {
      const members = document.getElementById('membersSidebar');
      const backdrop = document.getElementById('mobileBackdrop');
      document.getElementById('channelsSidebar').classList.remove('open');
      members.classList.toggle('open');
      backdrop.classList.toggle('active', members.classList.contains('open'));
    }

    function closeMobileDrawers() {
      document.getElementById('channelsSidebar').classList.remove('open');
      document.getElementById('membersSidebar').classList.remove('open');
      document.getElementById('mobileBackdrop').classList.remove('active');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }
  </script>
</body>
